<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificador de Cédula Venezolana</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      padding: 40px;
      width: 100%;
      max-width: 520px;
    }
    h1 {
      color: #1e3a8a;
      text-align: center;
      margin-bottom: 8px;
      font-size: 1.5rem;
    }
    .subtitle {
      color: #64748b;
      text-align: center;
      margin-bottom: 28px;
      font-size: 0.9rem;
    }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #374151;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 1.1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    button {
      width: 100%;
      padding: 14px;
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover:not(:disabled) { background: #1e40af; }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .loader {
      display: none;
      text-align: center;
      padding: 24px;
    }
    .spinner {
      border: 3px solid #e5e7eb;
      border-top-color: #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result { margin-top: 24px; }
    .card-section {
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .card-header {
      background: #1e3a8a;
      color: white;
      padding: 12px 16px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .card-body { padding: 8px; }
    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid #e5e7eb;
    }
    .data-row:last-child { border-bottom: none; }
    .data-label {
      color: #6b7280;
      font-size: 0.85rem;
    }
    .data-value {
      color: #111827;
      font-weight: 600;
      text-align: right;
    }
    .error {
      margin-top: 24px;
      padding: 20px;
      background: #fef2f2;
      border-radius: 12px;
      border: 1px solid #fecaca;
    }
    .error h3 { color: #dc2626; margin-bottom: 8px; font-size: 1rem; }
    .error p { color: #991b1b; font-size: 0.9rem; }
    .flag {
      display: inline-block;
      width: 24px;
      height: 16px;
      background: linear-gradient(to bottom, #ef4444 33%, #fbbf24 33%, #fbbf24 66%, #22c55e 66%);
      border-radius: 2px;
      margin-right: 8px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><span class="flag"></span>Verificar Cédula Venezolana</h1>
    <p class="subtitle">Consulta datos personales y electorales</p>

    <form id="form">
      <div class="form-group">
        <label for="cedula">Número de Cédula</label>
        <input type="text" id="cedula" placeholder="Ej: 11114068" pattern="\d+" required autocomplete="off">
      </div>
      <button type="submit" id="btn">Consultar</button>
    </form>

    <div class="loader" id="loader">
      <div class="spinner"></div>
      <p>Consultando registro...</p>
    </div>
    <div id="result"></div>
  </div>

  <script>
    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    const loader = document.getElementById('loader');
    const result = document.getElementById('result');
    const cedulaInput = document.getElementById('cedula');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const cedula = cedulaInput.value.trim();
      if (!/^\d+$/.test(cedula)) { alert('Solo números'); return; }

      btn.disabled = true;
      btn.textContent = 'Consultando...';
      loader.style.display = 'block';
      result.innerHTML = '';

      try {
        const res = await fetch('/api/verificar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cedula })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');
        mostrarResultado(data);
      } catch (err) {
        result.innerHTML = `<div class="error"><h3>Error</h3><p>${escapeHtml(err.message)}</p></div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Consultar';
        loader.style.display = 'none';
      }
    });

    const secciones = {
      'Datos Personales': ['cédula', 'rif', 'nombres', 'primer_apellido', 'segundo_apellido'],
      'Datos Electorales (CNE)': ['estado', 'municipio', 'parroquia', 'centro_electoral'],
    };

    function mostrarResultado(data) {
      let html = '<div class="result">';
      for (const [titulo, campos] of Object.entries(secciones)) {
        const items = campos.filter(c => data[c]).map(c =>
          `<div class="data-row"><span class="data-label">${formatearLabel(c)}</span><span class="data-value">${escapeHtml(data[c])}</span></div>`
        ).join('');
        if (items) {
          html += `<div class="card-section"><div class="card-header">${titulo}</div><div class="card-body">${items}</div></div>`;
        }
      }
      // Mostrar campos extra no listados
      const sobrantes = Object.entries(data).filter(([k]) =>
        !['fuente','timestamp','texto','raw_html'].includes(k) &&
        !Object.values(secciones).flat().includes(k)
      );
      if (sobrantes.length) {
        html += '<div class="card-section"><div class="card-header">Otros Datos</div><div class="card-body">' +
          sobrantes.map(([k,v]) =>
            `<div class="data-row"><span class="data-label">${formatearLabel(k)}</span><span class="data-value">${escapeHtml(v)}</span></div>`
          ).join('') + '</div></div>';
      }
      html += '</div>';
      result.innerHTML = html;
    }

    function formatearLabel(key) {
      return key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }
  </script>
</body>
</html>
